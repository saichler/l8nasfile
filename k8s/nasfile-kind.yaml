# KIND cluster version — uses KIND's built-in standard StorageClass
# KIND ships with rancher/local-path-provisioner pre-installed as StorageClass "standard"
# No custom StorageClass definition needed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nasfile
  labels:
    name: nasfile
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: nasfile
  name: nasfile
  labels:
    app: nasfile
spec:
  serviceName: nasfile
  replicas: 1
  selector:
    matchLabels:
      app: nasfile
  template:
    metadata:
      labels:
        app: nasfile
    spec:
      hostNetwork: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nasfile
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nasfile
          image: saichler/nasfile:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
