# Bare-metal PVC version — requires local-path-provisioner:
#   kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nasfile-local-storage
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: Namespace
metadata:
  name: nasfile
  labels:
    name: nasfile
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: nasfile
  name: nasfile
  labels:
    app: nasfile
spec:
  serviceName: nasfile
  replicas: 1
  selector:
    matchLabels:
      app: nasfile
  template:
    metadata:
      labels:
        app: nasfile
    spec:
      hostNetwork: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nasfile
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nasfile
          image: saichler/nasfile:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3443
            - containerPort: 4443
            - containerPort: 10005
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: hostfs
              mountPath: /host
      volumes:
        - name: hostfs
          hostPath:
            path: /
            type: Directory
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: nasfile-local-storage
        resources:
          requests:
            storage: 10Gi
