# Local hostPath version — single-node development/testing
---
apiVersion: v1
kind: Namespace
metadata:
  name: nasfile
  labels:
    name: nasfile
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: nasfile
  name: nasfile
  labels:
    app: nasfile
spec:
  selector:
    matchLabels:
      app: nasfile
  template:
    metadata:
      labels:
        app: nasfile
    spec:
      hostNetwork: true
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: nasfile
          image: registry.layer-8.dev:44443/nasfile/nasfile:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3443
            - containerPort: 4443
            - containerPort: 10005
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: hostfs
              mountPath: /host
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate
        - name: hostfs
          hostPath:
            path: /
            type: Directory
